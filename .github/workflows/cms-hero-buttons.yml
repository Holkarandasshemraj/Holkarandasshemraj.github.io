name: Wire Hero Secondary Button Controls

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin/config.yml'
      - 'content.yml'
      - '.github/workflows/cms-hero-buttons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch CMS and frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg = Path('admin/config.yml')
          s = cfg.read_text()
          marker = '              - {label: "Button Link", name: "button_link", widget: "string", required: false}\n'
          additions = marker + '              - {label: "Show Second Button", name: "show_second_button", widget: "boolean", required: false}\n              - {label: "Second Button Text", name: "second_button_text", widget: "string", required: false}\n              - {label: "Second Button Link", name: "second_button_link", widget: "string", required: false}\n'
          if 'name: "show_second_button"' not in s and marker in s:
              s = s.replace(marker, additions, 1)
          cfg.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          hook = r'''\n<script>\n(function(){\n  var cache=null,last=-1;\n  async function load(){\n    try{\n      var r=await fetch('/content.yml?cms='+Date.now(),{cache:'no-store'});\n      if(!r.ok)return;\n      var y=await r.text();\n      if(window.jsyaml) cache=window.jsyaml.load(y)||{};\n      else if(window.jsYaml) cache=window.jsYaml.load(y)||{};\n    }catch(e){}\n  }\n  function wire(){\n    var btn=document.getElementById('heroSecond'), nodes=document.querySelectorAll('.slide');\n    if(!btn||!nodes.length||!cache||!Array.isArray(cache.hero_images))return;\n    var i=0; for(var n=0;n<nodes.length;n++){if(nodes[n].classList.contains('active')){i=n;break;}}\n    var item=cache.hero_images[i]||{};\n    btn.textContent=item.second_button_text||'Visit Our Store';\n    btn.href=item.second_button_link||'#contact';\n    btn.style.display=item.show_second_button===false?'none':'';\n    if(i!==last){last=i;}\n  }\n  load().then(wire);\n  setInterval(wire,700);\n  setInterval(load,10000);\n})();\n</script>\n'''
          if 'cms='+Date.now() not in s:
              s = s.replace('</body>', hook + '</body>', 1)
          p.write_text(s)
          PY

      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin/config.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: connect hero secondary button to CMS [skip ci]'
          git push
