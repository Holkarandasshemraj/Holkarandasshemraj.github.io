backend:
  name: github
  repo: Holkarandasshemraj/Holkarandasshemraj.github.io
  branch: main
  base_url: https://hdhr-cms-auth.hishigoyal22.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Website"
    files:
      - name: "content"
        label: "Website Content"
        file: "content.yml"
        fields:

          # =========================
          # BASIC WEBSITE
          # =========================

          - label: "Shop Name"
            name: "shop_name"
            widget: "string"

          - label: "Tagline"
            name: "tagline"
            widget: "string"

          - label: "Logo"
            name: "logo"
            widget: "image"
            required: false

          # =========================
          # COLORS
          # =========================

          - label: "Primary Color"
            name: "primary_color"
            widget: "color"
            default: "#123B73"

          - label: "Secondary Color"
            name: "secondary_color"
            widget: "color"
            default: "#1F6B9C"

          - label: "Accent Color"
            name: "accent_color"
            widget: "color"
            default: "#F4A51C"

          - label: "Background Color"
            name: "background_color"
            widget: "color"
            default: "#F8FAFC"

          - label: "Card Background Color"
            name: "card_background_color"
            widget: "color"
            default: "#FFFFFF"

          - label: "Text Color"
            name: "text_color"
            widget: "color"
            default: "#17233C"

          - label: "Heading Color"
            name: "heading_color"
            widget: "color"
            default: "#123B73"

          - label: "Navigation Text Color"
            name: "nav_text_color"
            widget: "color"
            default: "#FFFFFF"

          - label: "Call Button Color"
            name: "call_color"
            widget: "color"
            default: "#123B73"

          - label: "Enquire Button Color"
            name: "enquire_color"
            widget: "color"
            default: "#25D366"

          - label: "Button Text Color"
            name: "button_text_color"
            widget: "color"
            default: "#FFFFFF"

          # =========================
          # FONTS
          # =========================

          - label: "Body Font"
            name: "font_family"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
            default: "Poppins"

          - label: "Heading Font"
            name: "heading_font"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          - label: "Navigation Font"
            name: "nav_font"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
            default: "Poppins"

          - label: "Button Font"
            name: "button_font"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
            default: "Poppins"

          - label: "Product Title Font"
            name: "product_title_font"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          - label: "Product Description Font"
            name: "product_description_font"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
            default: "Poppins"

          # =========================
          # FONT SIZES
          # =========================

          - label: "Main Heading Size"
            name: "heading_size"
            widget: "number"
            value_type: "int"
            default: 34
            min: 20
            max: 60

          - label: "Body Text Size"
            name: "body_size"
            widget: "number"
            value_type: "int"
            default: 16
            min: 12
            max: 24

          - label: "Product Title Size"
            name: "product_title_size"
            widget: "number"
            value_type: "int"
            default: 18
            min: 14
            max: 30

          - label: "Product Description Size"
            name: "product_description_size"
            widget: "number"
            value_type: "int"
            default: 14
            min: 11
            max: 22

          # =========================
          # HERO / SLIDER
          # =========================

          - label: "Hero Slider Images"
            name: "hero_images"
            widget: "list"
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"

          # =========================
          # ABOUT
          # =========================

          - label: "About Us"
            name: "about"
            widget: "text"

          # =========================
          # CONTACT
          # =========================

          - label: "Address"
            name: "address"
            widget: "text"

          - label: "Phone"
            name: "phone"
            widget: "string"

          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"

          - label: "Google Maps Link"
            name: "maps_link"
            widget: "string"
            required: false

          - label: "Shop Timings"
            name: "timings"
            widget: "text"
            required: false

          # =========================
          # CATEGORIES
          # =========================

          - label: "Categories"
            name: "categories"
            widget: "list"
            required: false
            fields:

              - label: "Category Name"
                name: "name"
                widget: "string"

              - label: "Category Icon"
                name: "icon"
                widget: "string"
                required: false

          # =========================
          # PRODUCTS
          # =========================

          - label: "Products"
            name: "products"
            widget: "list"
            required: false
            fields:

              - label: "Product Name"
                name: "name"
                widget: "string"

              - label: "Category"
                name: "category"
                widget: "string"

              - label: "Product Photo"
                name: "image"
                widget: "image"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

          # =========================
          # GALLERY
          # =========================

          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            fields:

              - label: "Photo"
                name: "image"
                widget: "image"

          # =========================
          # WHY CHOOSE US
          # =========================

          - label: "Why Choose Us"
            name: "why_choose_us"
            widget: "list"
            required: false
            fields:

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

          # =========================
          # SEO
          # =========================

          - label: "SEO Title"
            name: "seo_title"
            widget: "string"
            required: false

          - label: "SEO Description"
            name: "seo_description"
            widget: "text"
            required: false
