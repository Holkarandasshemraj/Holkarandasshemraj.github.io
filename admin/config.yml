backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Website"
    files:
      - name: "content"
        label: "Website Content"
        file: "content.yml"
        fields:

          # =========================
          # BASIC SHOP DETAILS
          # =========================

          - label: "Shop Name"
            name: "shop_name"
            widget: "string"

          - label: "Tagline"
            name: "tagline"
            widget: "string"

          - label: "Logo"
            name: "logo"
            widget: "image"
            required: false

          # =========================
          # COLORS
          # =========================

          - label: "Primary Color"
            name: "primary_color"
            widget: "color"
            default: "#123B73"

          - label: "Secondary Color"
            name: "secondary_color"
            widget: "color"
            default: "#1F6B9C"

          - label: "Accent Color"
            name: "accent_color"
            widget: "color"
            default: "#F4A51C"

          - label: "Background Color"
            name: "background_color"
            widget: "color"
            default: "#F8FAFC"

          - label: "Text Color"
            name: "text_color"
            widget: "color"
            default: "#17233C"

          - label: "Heading Color"
            name: "heading_color"
            widget: "color"
            default: "#123B73"

          # =========================
          # FONTS
          # =========================

          - label: "Font Family"
            name: "font_family"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          - label: "Heading Font Family"
            name: "heading_font"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          - label: "Heading Font Size"
            name: "heading_size"
            widget: "select"
            options:
              - "Small"
              - "Medium"
              - "Large"
              - "Extra Large"
            default: "Large"

          - label: "Body Font Size"
            name: "body_size"
            widget: "select"
            options:
              - "Small"
              - "Medium"
              - "Large"
            default: "Medium"

          # =========================
          # HERO SECTION
          # =========================

          - label: "Show Hero Section"
            name: "show_hero"
            widget: "boolean"
            default: true

          - label: "Hero Slider Images"
            name: "hero_images"
            widget: "list"
            required: false
            fields:

              - label: "Image"
                name: "image"
                widget: "image"

              - label: "Title"
                name: "title"
                widget: "string"
                required: false

              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
                required: false

          # =========================
          # ABOUT SECTION
          # =========================

          - label: "Show About Section"
            name: "show_about"
            widget: "boolean"
            default: true

          - label: "About Us"
            name: "about"
            widget: "text"

          # =========================
          # CATEGORIES
          # =========================

          - label: "Show Categories"
            name: "show_categories"
            widget: "boolean"
            default: true

          - label: "Categories"
            name: "categories"
            widget: "list"
            required: false
            fields:

              - label: "Category Name"
                name: "name"
                widget: "string"

              - label: "Icon"
                name: "icon"
                widget: "string"
                required: false

              - label: "Category Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Category Color"
                name: "color"
                widget: "color"
                required: false

              - label: "Show Category"
                name: "show"
                widget: "boolean"
                default: true

          # =========================
          # PRODUCTS
          # =========================

          - label: "Show Products"
            name: "show_products"
            widget: "boolean"
            default: true

          - label: "Products"
            name: "products"
            widget: "list"
            required: false
            fields:

              - label: "Product Name"
                name: "name"
                widget: "string"

              - label: "Category"
                name: "category"
                widget: "string"

              - label: "Photo"
                name: "image"
                widget: "image"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false

              - label: "Show Product"
                name: "show"
                widget: "boolean"
                default: true

          # =========================
          # GALLERY
          # =========================

          - label: "Show Gallery"
            name: "show_gallery"
            widget: "boolean"
            default: true

          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            fields:

              - label: "Photo"
                name: "image"
                widget: "image"

              - label: "Caption"
                name: "caption"
                widget: "string"
                required: false

          # =========================
          # WHY CHOOSE US
          # =========================

          - label: "Show Why Choose Us"
            name:
