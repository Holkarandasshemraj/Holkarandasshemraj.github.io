backend:
  name: github
  repo: Holkarandasshemraj/Holkarandasshemraj.github.io
  branch: main
  base_url: https://hdhr-cms-auth.hishigoyal22.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Website"
    files:
      - name: "content"
        label: "Website Content"
        file: "content.yml"

        fields:

          - label: "Shop Name"
            name: "shop_name"
            widget: "string"
            required: false

          - label: "Tagline"
            name: "tagline"
            widget: "string"
            required: false

          - label: "Logo"
            name: "logo"
            widget: "image"
            required: false

          # COLORS

          - label: "Primary Color"
            name: "primary_color"
            widget: "color"
            required: false
            default: "#EE305E"

          - label: "Secondary Color"
            name: "secondary_color"
            widget: "color"
            required: false
            default: "#E2DE61"

          - label: "Accent Color"
            name: "accent_color"
            widget: "color"
            required: false
            default: "#F5A623"

          - label: "Background Color"
            name: "background_color"
            widget: "color"
            required: false
            default: "#FFFDF7"

          - label: "Text Color"
            name: "text_color"
            widget: "color"
            required: false
            default: "#17233C"

          - label: "Heading Color"
            name: "heading_color"
            widget: "color"
            required: false
            default: "#123B73"

          - label: "Navigation Text Color"
            name: "nav_text_color"
            widget: "color"
            required: false
            default: "#FFFFFF"

          - label: "Card Background Color"
            name: "card_background_color"
            widget: "color"
            required: false
            default: "#FFFFFF"

          # CALL / ENQUIRE COLORS

          - label: "Call Button Color"
            name: "call_button_color"
            widget: "color"
            required: false
            default: "#123B73"

          - label: "Enquire Button Color"
            name: "enquire_button_color"
            widget: "color"
            required: false
            default: "#25D366"

          - label: "Button Text Color"
            name: "button_text_color"
            widget: "color"
            required: false
            default: "#FFFFFF"

          # FONTS

          - label: "Body Font"
            name: "font_family"
            widget: "select"
            required: false
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
            default: "Poppins"

          - label: "Heading Font"
            name: "heading_font"
            widget: "select"
            required: false
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          - label: "Hero Heading Font"
            name: "hero_heading_font"
            widget: "select"
            required: false
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          - label: "Hero Text Font"
            name: "hero_text_font"
            widget: "select"
            required: false
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
            default: "Poppins"

          - label: "Section Heading Font"
            name: "section_heading_font"
            widget: "select"
            required: false
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          # FONT SIZES

          - label: "Main Heading Size"
            name: "heading_size"
            widget: "select"
            required: false
            options:
              - "Small"
              - "Medium"
              - "Large"
              - "Extra Large"
            default: "Medium"

          - label: "Body Text Size"
            name: "body_size"
            widget: "select"
            required: false
            options:
              - "Small"
              - "Medium"
              - "Large"
            default: "Medium"

          - label: "Product Title Font"
            name: "product_title_font"
            widget: "select"
            required: false
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
              - "Playfair Display"
            default: "Poppins"

          - label: "Product Description Font"
            name: "product_description_font"
            widget: "select"
            required: false
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
              - "Georgia"
            default: "Poppins"

          - label: "Product Title Size"
            name: "product_title_size"
            widget: "number"
            required: false
            value_type: "int"
            default: 18
            min: 14
            max: 30

          - label: "Product Description Size"
            name: "product_description_size"
            widget: "number"
            required: false
            value_type: "int"
            default: 14
            min: 11
            max: 22

          # HERO

          - label: "Show Hero Section"
            name: "show_hero"
            widget: "boolean"
            required: false
            default: true

          - label: "Hero Slider"
            name: "hero_images"
            widget: "list"
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                required: false
              - label: "Heading"
                name: "heading"
                widget: "string"
                required: false
              - label: "Text"
                name: "text"
                widget: "text"
                required: false
              - label: "Show Overlay"
                name: "show_overlay"
                widget: "boolean"
                required: false
                default: true
              - label: "Overlay Color"
                name: "overlay_color"
                widget: "color"
                required: false
              - label: "Overlay Opacity"
                name: "overlay_opacity"
                widget: "number"
                required: false
                value_type: "float"
                min: 0
                max: 1
                step: 0.05
              - label: "Blur"
                name: "blur"
                widget: "boolean"
                required: false
                default: false
              - label: "Blur Amount (px)"
                name: "blur_amount"
                widget: "number"
                required: false
                value_type: "int"
                min: 0
                max: 20
              - label: "Gradient"
                name: "gradient"
                widget: "boolean"
                required: false
                default: false
              - label: "Gradient Color"
                name: "gradient_color"
                widget: "color"
                required: false
              - label: "Button Text"
                name: "button_text"
                widget: "string"
                required: false
              - label: "Button Link"
                name: "button_link"
                widget: "string"
                required: false
              - label: "Show Button"
                name: "show_button"
                widget: "boolean"
                required: false
                default: false

          # ABOUT

          - label: "Show About Section"
            name: "show_about"
            widget: "boolean"
            required: false
            default: true

          - label: "About Us"
            name: "about"
            widget: "text"
            required: false

          # CONTACT

          - label: "Address"
            name: "address"
            widget: "text"
            required: false

          - label: "Phone"
            name: "phone"
            widget: "string"
            required: false

          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"
            required: false

          - label: "Google Maps Link"
            name: "maps_link"
            widget: "string"
            required: false

          - label: "Shop Timings"
            name: "timings"
            widget: "text"
            required: false

          # CALL BUTTON

          - label: "Show Call Button"
            name: "show_call_button"
            widget: "boolean"
            required: false
            default: true

          - label: "Call Button Text"
            name: "call_button_text"
            widget: "string"
            required: false
            default: "Call Now"

          # ENQUIRE BUTTON

          - label: "Show Enquire Button"
            name: "show_enquire_button"
            widget: "boolean"
            required: false
            default: true

          - label: "Enquire Button Text"
            name: "enquire_button_text"
            widget: "string"
            required: false
            default: "Enquire"

          # CATEGORIES

          - label: "Show Categories Section"
            name: "show_categories"
            widget: "boolean"
            required: false
            default: true

          - label: "Categories"
            name: "categories"
            widget: "list"
            required: false
            fields:

              - label: "Category Name"
                name: "name"
                widget: "string"

              - label: "Icon"
                name: "icon"
                widget: "string"
                required: false

              - label: "Category Image"
                name: "image"
                widget: "image"
                required: false

              - label: "Category Color"
                name: "color"
                widget: "color"
                required: false

              - label: "Show Category"
                name: "show"
                widget: "boolean"
                default: true

          # PRODUCTS

          - label: "Show Products Section"
            name: "show_products"
            widget: "boolean"
            required: false
            default: true

          - label: "Products"
            name: "products"
            widget: "list"
            required: false
            fields:

              - label: "Product Name"
                name: "name"
                widget: "string"

              - label: "Category"
                name: "category"
                widget: "string"

              - label: "Photo"
                name: "image"
                widget: "image"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Show Product"
                name: "show"
                widget: "boolean"
                default: true

          # GALLERY

          - label: "Show Gallery Section"
            name: "show_gallery"
            widget: "boolean"
            required: false
            default: true

          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            fields:

              - label: "Photo"
                name: "image"
                widget: "image"

              - label: "Caption"
                name: "caption"
                widget: "string"
                required: false

          # WHY CHOOSE US

          - label: "Show Why Choose Us Section"
            name: "show_why_choose_us"
            widget: "boolean"
            required: false
            default: true

          - label: "Why Choose Us"
            name: "why_choose_us"
            widget: "list"
            required: false
            fields:

              - label: "Icon"
                name: "icon"
                widget: "string"
                required: false

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

          # SEO

          - label: "SEO Title"
            name: "seo_title"
            widget: "string"
            required: false

          - label: "SEO Description"
            name: "seo_description"
            widget: "text"
            required: false

          # FOOTER

          - label: "Footer Text"
            name: "footer_text"
            widget: "string"
            required: false
