backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Website"
    files:
      - name: "content"
        label: "Website Content"
        file: "content.yml"
        fields:

          - label: "Shop Name"
            name: "shop_name"
            widget: "string"

          - label: "Tagline"
            name: "tagline"
            widget: "string"

          - label: "Logo"
            name: "logo"
            widget: "image"
            required: false

          - label: "Primary Color"
            name: "primary_color"
            widget: "color"
            default: "#123B73"

          - label: "Secondary Color"
            name: "secondary_color"
            widget: "color"
            default: "#1F6B9C"

          - label: "Accent Color"
            name: "accent_color"
            widget: "color"
            default: "#F4A51C"

          - label: "Background Color"
            name: "background_color"
            widget: "color"
            default: "#F8FAFC"

          - label: "Text Color"
            name: "text_color"
            widget: "color"
            default: "#17233C"

          - label: "Heading Color"
            name: "heading_color"
            widget: "color"
            default: "#123B73"

          - label: "Font Family"
            name: "font_family"
            widget: "select"
            options:
              - "Poppins"
              - "Montserrat"
              - "Nunito"
              - "Roboto"
              - "Arial"
            default: "Poppins"

          - label: "Hero Slider Images"
            name: "hero_images"
            widget: "list"
            required: false
            fields:
              - label: "Image"
                name: "image"
                widget: "image"

          - label: "About Us"
            name: "about"
            widget: "text"

          - label: "Address"
            name: "address"
            widget: "text"

          - label: "Phone"
            name: "phone"
            widget: "string"

          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"

          - label: "Google Maps Link"
            name: "maps_link"
            widget: "string"
            required: false

          - label: "Shop Timings"
            name: "timings"
            widget: "text"
            required: false

          - label: "Categories"
            name: "categories"
            widget: "list"
            required: false
            fields:
              - label: "Name"
                name: "name"
                widget: "string"

              - label: "Icon"
                name: "icon"
                widget: "string"

          - label: "Products"
            name: "products"
            widget: "list"
            required: false
            fields:
              - label: "Product Name"
                name: "name"
                widget: "string"

              - label: "Category"
                name: "category"
                widget: "string"

              - label: "Photo"
                name: "image"
                widget: "image"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"

          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            fields:
              - label: "Photo"
                name: "image"
                widget: "image"

          - label: "Why Choose Us"
            name: "why_choose_us"
            widget: "list"
            required: false
            fields:
              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

          - label: "SEO Title"
            name: "seo_title"
            widget: "string"
            required: false

          - label: "SEO Description"
            name: "seo_description"
            widget: "text"
            required: false
